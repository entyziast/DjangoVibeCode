{% load static %}
<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Подготовка к экзаменам{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'study/style.css' %}">
</head>
<body>
    <a class="skip-link" href="#main">Перейти к содержимому</a>
    <header class="site-header">
        <div class="container header-content">
            <a class="brand" href="{% url 'study:subjects' %}">Экзамен<span> / подготовка</span></a>
            <span class="header-note">Вопрос. Размышление. Ответ.</span>
        </div>
    </header>
    <main id="main" class="container">
        {% block content %}{% endblock %}
    </main>
    <footer class="container site-footer">Готовые учебные материалы · Без оценок и спешки</footer>
</body>
</html>
